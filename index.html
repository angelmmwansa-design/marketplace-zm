<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARKETPLACE ZM - Zambia's Premium Marketplace</title>
    <!-- Tailwind CSS Script -->
    <script src="https://jsdelivr.net"></script>
    <style>
        .hidden-view { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">

    <!-- 🌐 TOP NAVIGATION BAR -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <!-- App Logo -->
            <div class="text-2xl font-black tracking-tight text-blue-600 cursor-pointer" onclick="switchView('browse-view')">
                MARKETPLACE <span class="text-emerald-600">ZM</span>
            </div>

            <!-- Global Search Form -->
            <div class="flex-1 max-w-md mx-6">
                <div class="flex gap-2">
                    <input type="text" id="search-input" placeholder="Search products..." class="w-full bg-gray-100 border border-gray-300 rounded-lg px-4 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button onclick="applyFilters()" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-blue-700 cursor-pointer">Search</button>
                </div>
            </div>

            <!-- Nav Action Buttons -->
            <div class="flex items-center gap-4">
                <button onclick="switchView('browse-view')" class="text-sm font-medium text-gray-600 hover:text-blue-600 cursor-pointer">Browse</button>
                <button id="nav-chat-btn" onclick="switchView('chat-view')" class="text-sm font-medium text-gray-600 hover:text-blue-600 relative cursor-pointer hidden">
                    Messages <span id="chat-badge" class="absolute -top-2 -right-3 bg-red-500 text-white rounded-full text-[10px] px-1 hidden">!</span>
                </button>
                <button id="nav-dashboard-btn" onclick="switchView('dashboard-view')" class="text-sm font-medium text-gray-600 hover:text-blue-600 cursor-pointer hidden">Seller Panel</button>
                <span id="user-display-name" class="text-sm font-semibold text-gray-700 hidden"></span>
                <button id="auth-action-btn" onclick="handleAuthNav()" class="bg-blue-600 text-white text-sm font-semibold px-4 py-2 rounded-lg hover:bg-blue-700 cursor-pointer">Log In</button>
            </div>
        </div>
    </nav>

    <!-- 🎛️ FILTERS & CATEGORIES BAR -->
    <div id="filter-bar" class="bg-white border-b border-gray-200 py-3 shadow-2xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-wrap gap-4 items-center justify-between text-sm">
            <div class="flex flex-wrap gap-3 items-center">
                <!-- Category Selector -->
                <select id="filter-category" class="bg-gray-50 border border-gray-300 rounded-md p-1.5 focus:outline-none">
                    <option value="">All Categories</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Vehicles">Vehicles</option>
                    <option value="Property">Property & Housing</option>
                    <option value="Fashion">Fashion & Apparel</option>
                    <option value="Farming">Farming & Agriculture</option>
                </select>

                <!-- Condition Selector -->
                <select id="filter-condition" class="bg-gray-50 border border-gray-300 rounded-md p-1.5 focus:outline-none">
                    <option value="">All Conditions</option>
                    <option value="New">New</option>
                    <option value="Used">Used</option>
                </select>

                <!-- Location Selector -->
                <select id="filter-location" class="bg-gray-50 border border-gray-300 rounded-md p-1.5 focus:outline-none">
                    <option value="">All Regions</option>
                    <option value="Lusaka">Lusaka</option>
                    <option value="Copperbelt">Copperbelt</option>
                    <option value="Central">Central</option>
                    <option value="Southern">Southern</option>
                </select>

                <!-- Max Price Filter -->
                <input type="number" id="filter-price" placeholder="Max Price (ZMW)" class="bg-gray-50 border border-gray-300 rounded-md p-1.5 max-w-[140px] focus:outline-none">
            </div>
            <button onclick="applyFilters()" class="text-xs bg-gray-200 text-gray-700 font-bold px-3 py-2 rounded-md hover:bg-gray-300 cursor-pointer">Apply Advanced Filters</button>
        </div>
    </div>

    <!-- 🖥️ INTERFACE VIEWPORTS -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- 🔑 1. AUTHENTICATION VIEW (LOGIN & REGISTER) -->
        <section id="auth-view" class="hidden-view max-w-md mx-auto bg-white p-8 rounded-2xl border border-gray-200 shadow-sm mt-8">
            <div class="flex justify-center border-b border-gray-200 mb-6">
                <button id="tab-login" onclick="toggleAuthTab('login')" class="w-1/2 pb-3 font-bold border-b-2 border-blue-600 text-blue-600 text-center cursor-pointer">Sign In</button>
                <button id="tab-register" onclick="toggleAuthTab('register')" class="w-1/2 pb-3 font-medium text-gray-500 text-center cursor-pointer">Create Account</button>
            </div>

            <!-- Login Sub-Form -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1">Mobile Money Number (Account ID)</label>
                    <input type="text" id="login-phone" required placeholder="e.g., 0970325855" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1">Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 cursor-pointer transition">Log Into Platform</button>
            </form>

            <!-- Registration Sub-Form -->
            <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden-view">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1">First Name</label>
                        <input type="text" id="reg-first" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1">Last Name</label>
                        <input type="text" id="reg-last" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1">Account Structure Tier</label>
                    <div class="flex gap-4 mt-1">
                        <label class="flex items-center gap-2 cursor-pointer text-sm"><input type="radio" name="reg-type" value="Personal" checked> Personal Account</label>
                        <label class="flex items-center gap-2 cursor-pointer text-sm"><input type="radio" name="reg-type" value="Business"> Business Entity</label>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1">Mobile Money Provider</label>
                    <select id="reg-provider" required class="w-full border border-gray-300 rounded-lg p-2.5 bg-white focus:outline-none">
                        <option value="MTN">MTN Mobile Money</option>
                        <option value="Airtel">Airtel Money</option>
                        <option value="Zamtel">Zamtel Kwacha</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1">Mobile Money Number (For Secure Remittance)</label>
                    <input type="text" id="reg-phone" required placeholder="e.g., 097XXXXXXXX" class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1">Secure Password</label>
                    <input type="password" id="reg-password" required placeholder="Minimum 6 characters" class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-lg hover:bg-emerald-700 cursor-pointer transition">Register Secure Account</button>
            </form>
        </section>

        <!-- 🛍️ 2. BROWSE FEED VIEW (MARKETPLACE MAIN GRID) -->
        <section id="browse-view">
            <h2 class="text-xl font-extrabold text-gray-900 mb-6 tracking-tight">Active Live Listings Across Zambia</h2>
